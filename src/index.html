<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Hyperbeam Share</title>
  <style>
    body {
      font: 14px -apple-system, sans-serif;
      background: #111; color: #eee;
      margin: 0; padding: 24px;
    }
    button {
      background: #2563eb; color: white; border: none;
      padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    button:disabled { background: #444; cursor: default; }
    button.secondary { background: #333; }
    select, input[type=text] {
      width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #444;
      background: #1c1c1c; color: #eee; margin: 6px 0 14px;
    }
    #path { font-size: 12px; color: #999; word-break: break-all; }
    #log { font-size: 12px; color: #f59e0b; margin-top: 10px; white-space: pre-wrap; }
    #result { margin-top: 16px; padding: 12px; background: #1c1c1c; border-radius: 6px; display: none; }
    #url { font-size: 13px; color: #4ade80; word-break: break-all; }
    label { display: block; margin-top: 14px; font-size: 13px; color: #ccc; }
  </style>
</head>
<body>
  <h2>Hyperbeam Share</h2>

  <button id="pick">Choose video file…</button>
  <div id="path"></div>

  <label for="subs">Subtitle track</label>
  <select id="subs" disabled>
    <option value="">None</option>
  </select>

  <div>
    <button id="go" disabled>Prepare &amp; Share</button>
    <button id="stop" class="secondary" style="display:none">Stop Sharing</button>
  </div>

  <div id="log"></div>

  <div id="result">
    <div>Paste this into Hyperbeam:</div>
    <div id="url"></div>
    <button id="copy" class="secondary" style="margin-top:8px">Copy URL</button>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
