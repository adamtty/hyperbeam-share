name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly: everything, fuzzing included

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=rust-lang/rust
  RUST_VERSION: 1.99.1
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.31.1
  # renovate: datasource=pypi depName=shellcheck-py
  SHELLCHECK_VERSION: 0.11.0.1
  # cargo-fuzz needs nightly; pinned to a dated build so fuzz runs are reproducible
  RUST_NIGHTLY: nightly-2026-10-15
  # renovate: datasource=crate depName=cargo-fuzz
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  # Which expensive jobs a pull request needs. Fuzzing runs when the code it fuzzes or the fuzz harnesses change,
  # not for dependency or CI version bumps (those are fuzzed on main after merge, and weekly). Pushes, the weekly
  # run and manual runs do everything. If the file list can't be read, everything runs.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # list the pull request's changed files
    outputs:
      fuzz: ${{ steps.files.outputs.fuzz }}
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: What changed
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          FUZZ_PATHS: '^(src-tauri/src/|src-tauri/fuzz/fuzz_targets/|src-tauri/fuzz/corpus/)'
          DOCS_PATHS: '^(.*\.md|docs/|LICENSE$|\.github/ISSUE_TEMPLATE/)'
        run: |
          everything() {
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ -n "$PR" ] || everything
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)') ||
            { echo "::warning::couldn't list the changed files; running everything"; everything; }
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq "$FUZZ_PATHS"; then fuzz=true; else fuzz=false; fi
          echo "fuzz=$fuzz" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$files" | grep -Evq "$DOCS_PATHS"; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor (workflow security)
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --offline --min-severity low .github/workflows

      - name: shellcheck
        run: pipx run --spec "shellcheck-py==${SHELLCHECK_VERSION}" shellcheck scripts/*.sh

      - name: JavaScript parses
        run: node --check src/main.js

  rust:
    name: Rust
    needs: changes
    # skipped only on an explicit "false" (a failed Changes job means run it)
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # macOS runners only support audit mode: connections are logged, not blocked
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            src-tauri/target
          key: rust-${{ env.RUST_VERSION }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      # tauri-build wants the sidecars to exist; tests never run them
      - name: Placeholder sidecars
        run: |
          mkdir -p src-tauri/binaries
          for b in ffmpeg ffprobe cloudflared; do
            printf '#!/bin/sh\nexit 1\n' > "src-tauri/binaries/$b-aarch64-apple-darwin"
            chmod +x "src-tauri/binaries/$b-aarch64-apple-darwin"
          done

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked

  fuzz:
    name: Fuzz
    needs: changes
    # skipped only on an explicit "false" (a failed Changes job means run it)
    if: ${{ !cancelled() && needs.changes.outputs.fuzz != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nightly Rust and cargo-fuzz
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rustfmt,clippy
          cargo +"$RUST_NIGHTLY" install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked

      - name: rustfmt and clippy (fuzz targets)
        working-directory: src-tauri/fuzz
        run: |
          cargo +"$RUST_NIGHTLY" fmt --check
          cargo +"$RUST_NIGHTLY" clippy --locked --bins -- -D warnings

      # coverage-guided (libFuzzer); -timeout makes any input slower than 10 s a failure
      - name: Fuzz
        working-directory: src-tauri
        run: |
          for t in ffprobe_json tunnel_url; do
            mkdir -p "$RUNNER_TEMP/corpus/$t"
            cp fuzz/corpus/"$t"/* "$RUNNER_TEMP/corpus/$t/"
            cargo +"$RUST_NIGHTLY" fuzz run "$t" "$RUNNER_TEMP/corpus/$t" -- -max_total_time=60 -timeout=10
          done

      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: src-tauri/fuzz/artifacts/
          retention-days: 14
