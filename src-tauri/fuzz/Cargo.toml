# cargo-fuzz targets for src/parse.rs (included by path, so this needs no Tauri).
# Run: cargo +nightly fuzz run ffprobe_json   (needs `cargo install cargo-fuzz`)
[package]
name = "hyperbeam-share-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "ffprobe_json"
path = "fuzz_targets/ffprobe_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tunnel_url"
path = "fuzz_targets/tunnel_url.rs"
test = false
doc = false
bench = false

# its own workspace, so it's never built as part of the app
[workspace]
members = ["."]
